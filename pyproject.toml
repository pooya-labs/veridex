[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veridex"
version = "0.1.0"
description = "A production-grade LLM evaluation, regression testing, and reliability harness for applied AI engineering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pooya Goodarzi", email = "pooya16.pg@gmail.com" }
]
keywords = [
    "ai",
    "llm",
    "evaluation",
    "evals",
    "testing",
    "regression",
    "guardrails",
    "observability",
    "agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
veridex = "veridex.cli:main"

[project.urls]
Homepage = "https://pooya-labs.github.io/veridex/"
Repository = "https://github.com/pooya-labs/veridex"
Issues = "https://github.com/pooya-labs/veridex/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["veridex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
